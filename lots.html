<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferme Avicole - Vente par Lots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Ferme Avicole Moderne</h1>
            <span class="tagline">Élevage sain & naturel</span>
        </div>
        <nav>
            <a href="index.html">Vente au Détail</a>
            <a href="lots.html" class="active">Vente par Lots</a>
            <a href="panier.html">Mon Panier <span id="cart-count" class="badge">0</span></a>
        </nav>
    </header>

    <section class="hero hero-lots">
        <div class="hero-content">
            <span class="hero-tag">Tarifs Éleveurs & Grossistes</span>
            <h2>Nos Offres par Lots</h2>
            <p>Lots de poussins d'un jour vaccinés, lots de cailles et packs de poulets pour vos élevages, cérémonies et restaurants.</p>
        </div>
    </section>

    <main class="container" data-page-type="lot">
        <div class="filters" id="category-filters">
            <button class="filter-btn active" onclick="filterProducts('Tout', 'lot')">Tous les lots</button>
            <button class="filter-btn" onclick="filterProducts('Poussins', 'lot')">Lots de Poussins</button>
            <button class="filter-btn" onclick="filterProducts('Caille', 'lot')">Lots de Cailles</button>
            <button class="filter-btn" onclick="filterProducts('Poulet de chair', 'lot')">Lots Poulet de chair</button>
            <button class="filter-btn" onclick="filterProducts('Poulet Rainbow', 'lot')">Lots Poulet Rainbow</button>
            <button class="filter-btn" onclick="filterProducts('Poulet local', 'lot')">Lots Poulet local</button>
        </div>

        <div class="products-grid" id="products-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
